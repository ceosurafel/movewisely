name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: movewisely-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, Regression Tests & Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript typecheck
        run: bun run lint

      - name: Run complete analysis regression suite
        run: bun run test

      - name: Build production bundle
        run: bun run build

      - name: Set up headless Chrome
        uses: browser-actions/setup-chrome@v2
        id: setup-chrome
        with:
          chrome-version: stable

      - name: Smoke test Stockfish WASM in a real browser worker
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: |
          cp scripts/stockfishBrowserSmoke.html dist/stockfish-browser-smoke.html
          ./node_modules/.bin/vite preview --host 127.0.0.1 --port 4173 > /tmp/movewisely-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/stockfish-browser-smoke.html > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/stockfish-browser-smoke.html > /dev/null

          "$CHROME_PATH" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --timeout=30000 --dump-dom http://127.0.0.1:4173/stockfish-browser-smoke.html > /tmp/movewisely-browser-smoke-dom.html
          cat /tmp/movewisely-browser-smoke-dom.html
          grep -q '<pre id="status">BROWSER_SMOKE_PASS:' /tmp/movewisely-browser-smoke-dom.html

  baseline-main:
    name: Verify unchanged main baseline
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript typecheck
        run: bun run lint

      - name: Run main regression suites
        run: bun run test

      - name: Build main production bundle
        run: bun run build
