name: CI

on:
  push:
    branches:
      - main
      - master
      - 'deployment/**'
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: movewisely-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, Dependency Audit, Regression Tests, Browser Engine & Build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Audit all dependencies for known vulnerabilities
        run: bun audit

      - name: TypeScript typecheck
        run: bun run lint

      - name: Run complete analysis regression suite
        run: bun run test

      - name: Build production bundle
        run: bun run build

      - name: Validate Cloudflare Pages output and legal notices
        run: |
          test -s dist/index.html
          test -s dist/_headers
          test -s dist/third-party-notices.html
          test -s dist/stockfish/Copying.txt
          test -n "$(find dist/assets -maxdepth 1 -type f -name '*.js' -print -quit)"
          echo "Cloudflare Pages output, security headers, app bundle, and Stockfish license files are present."

      - name: Set up headless Chrome
        uses: browser-actions/setup-chrome@v2
        id: setup-chrome
        with:
          chrome-version: stable

      - name: Smoke test Stockfish WASM and complete checkup in a real browser
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: |
          cp scripts/stockfishBrowserSmoke.html dist/stockfish-browser-smoke.html
          ./node_modules/.bin/vite preview --host 127.0.0.1 --port 4173 > /tmp/movewisely-preview.log 2>&1 &
          preview_pid=$!
          "$CHROME_PATH" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --no-first-run --no-default-browser-check --remote-debugging-address=127.0.0.1 --remote-debugging-port=9222 --remote-allow-origins="*" --user-data-dir=/tmp/movewisely-chrome-profile about:blank > /tmp/movewisely-chrome.log 2>&1 &
          chrome_pid=$!
          cleanup() {
            kill "$chrome_pid" "$preview_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/stockfish-browser-smoke.html > /dev/null &&
               curl --fail --silent http://127.0.0.1:9222/json > /dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            echo "Preview server or Chrome DevTools failed to become ready."
            cat /tmp/movewisely-preview.log || true
            cat /tmp/movewisely-chrome.log || true
            exit 1
          fi

          bun run scripts/testStockfishBrowser.mjs
          bun run scripts/testCheckupFlow.mjs
