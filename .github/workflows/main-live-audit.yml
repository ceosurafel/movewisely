name: Main Baseline Live Audit

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: movewisely-main-baseline-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-main:
    name: Main Baseline — Full Tests, Browser Engine & 20 Real Games
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout unmodified main baseline
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Checkout audit-only test harness
        uses: actions/checkout@v4
        with:
          ref: audit/main-real-analysis-2026-10-11
          path: audit-harness

      - name: Install audit harness into temporary main worktree
        run: |
          cp audit-harness/scripts/testLiveHikaruAnalysis.ts scripts/testLiveHikaruAnalysis.ts
          cp audit-harness/scripts/stockfishBrowserSmoke.html scripts/stockfishBrowserSmoke.html
          cp audit-harness/scripts/testStockfishBrowser.mjs scripts/testStockfishBrowser.mjs

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'

      - name: Install main branch locked dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript typecheck on main
        run: bun run lint

      - name: Full regression suite on main
        run: bun run test

      - name: Production build on main
        run: bun run build

      - name: Set up headless Chrome
        uses: browser-actions/setup-chrome@v2
        id: setup-chrome
        with:
          chrome-version: stable

      - name: Smoke test main Stockfish worker and WASM in Chromium
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: |
          cp scripts/stockfishBrowserSmoke.html dist/stockfish-browser-smoke.html
          ./node_modules/.bin/vite preview --host 127.0.0.1 --port 4173 > /tmp/movewisely-main-preview.log 2>&1 &
          preview_pid=$!
          "$CHROME_PATH" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --no-first-run --no-default-browser-check --remote-debugging-address=127.0.0.1 --remote-debugging-port=9222 --remote-allow-origins="*" --user-data-dir=/tmp/movewisely-main-chrome-profile about:blank > /tmp/movewisely-main-chrome.log 2>&1 &
          chrome_pid=$!
          cleanup() {
            kill "$chrome_pid" "$preview_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/stockfish-browser-smoke.html > /dev/null &&
               curl --fail --silent http://127.0.0.1:9222/json > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/stockfish-browser-smoke.html > /dev/null
          curl --fail --silent http://127.0.0.1:9222/json > /dev/null
          bun run scripts/testStockfishBrowser.mjs

      - name: Analyze 20 real Hikaru Chess.com Blitz games using main source
        run: ./node_modules/.bin/tsx scripts/testLiveHikaruAnalysis.ts
